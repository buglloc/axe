# Vendored from findutils 0.10.0; see .cargo_vcs_info.json for upstream provenance.
[package]
name = "findutils"
version = "0.10.0"
edition = "2021"
authors = ["uutils developers"]
autobins = false
autotests = false
autobenches = false
description = "Rust implementation of GNU findutils"
homepage = "https://github.com/uutils/findutils"
repository = "https://github.com/uutils/findutils"
license = "MIT"

[lib]
path = "src/lib.rs"
doctest = false
test = false

[dependencies]
argmax = "0.4.0"
chrono = "0.4.45"
faccess = "0.2.4"
nix = { version = "0.31", features = ["fs", "user"] }
onig = { version = "6.5", default-features = false }
regex = "1.12"
thiserror = "2.0.12"
uucore = { version = "0.9.0", features = ["entries", "fs", "fsext", "mode"] }
walkdir = "2.5"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
