# Vendored from uutils coreutils 0.12.0; upstream provenance is in .cargo_vcs_info.json.
[package]
edition = "2024"
rust-version = "1.88.0"
name = "uu_mknod"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "mknod ~ (uutils) create special file NAME of TYPE"
homepage = "https://github.com/uutils/coreutils"
readme = "README.package.md"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/mknod"

[features]
diagnostics = ["uucore/diagnostics"]
selinux = ["uucore/selinux"]
smack = ["uucore/smack"]

[lib]
name = "uu_mknod"
path = "src/mknod.rs"
test = false
doctest = false

[[bin]]
name = "mknod"
path = "src/main.rs"

[dependencies.clap]
version = "4.5"
features = [
    "wrap_help",
    "cargo",
    "color",
]

[dependencies.fluent]
version = "0.17.0"

[dependencies.nix]
version = "0.31.3"
features = ["fs"]
default-features = false

[dependencies.uucore]
version = "0.12.0"
features = [
    "fs",
    "mode",
]

