# Vendored from uutils coreutils 0.12.0; upstream provenance is in .cargo_vcs_info.json.
[package]
edition = "2024"
rust-version = "1.88.0"
name = "uu_more"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "more ~ (uutils) input perusal filter"
homepage = "https://github.com/uutils/coreutils"
readme = "README.package.md"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/more"

[lib]
name = "uu_more"
path = "src/more.rs"
doctest = false

[[bin]]
name = "more"
path = "src/main.rs"

[dependencies.clap]
version = "4.5"
features = [
    "wrap_help",
    "cargo",
    "color",
]

[dependencies.crossterm]
version = "0.29.0"
features = ["events"]
default-features = false

[dependencies.fluent]
version = "0.17.0"

[dependencies.uucore]
version = "0.12.0"

[target.'cfg(target_vendor = "apple")'.dependencies.crossterm]
version = "0.29.0"
features = ["use-dev-tty"]
default-features = false

[target."cfg(windows)".dependencies.crossterm]
version = "0.29.0"
features = ["windows"]
default-features = false

[dev-dependencies]
tempfile = "3"
