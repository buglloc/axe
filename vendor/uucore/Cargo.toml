"utf8" = []
"utmpx" = ["time", "time/macros", "libc", "dns-lookup"]
"version-cmp" = []
"wide" = []
"tty" = []
"time" = ["jiff"]
"uptime" = ["jiff", "libc", "rustix/time", "utmp-classic", "utmpx", "windows-sys"]
"benchmark" = ["itertools", "tempfile"]

["lints"]

["lints"."rust"]
"unused_qualifications" = "warn"

["lints"."rust"."renamed_and_removed_lints"]
"level" = "allow"
"priority" = -1

["lints"."rust"."unexpected_cfgs"]
"level" = "warn"
"check-cfg" = ["cfg(fuzzing)", "cfg(pgo_training)", "cfg(target_os, values(\"cygwin\"))", "cfg(wasi_runner)"]

["lints"."clippy"]
"use_self" = "warn"
"cargo_common_metadata" = "allow"
"multiple_crate_versions" = "allow"
"missing_errors_doc" = "allow"
"missing_panics_doc" = "allow"
"must_use_candidate" = "allow"
"cast_possible_truncation" = "allow"
"too_many_lines" = "allow"
"cast_possible_wrap" = "allow"
"cast_sign_loss" = "allow"
"struct_excessive_bools" = "allow"
"cast_precision_loss" = "allow"
"cast_lossless" = "allow"
"ignored_unit_patterns" = "allow"
"similar_names" = "allow"
"needless_pass_by_value" = "allow"
"float_cmp" = "allow"
"return_self_not_must_use" = "allow"
"inline_always" = "allow"
"fn_params_excessive_bools" = "allow"
"should_panic_without_expect" = "allow"
"doc_markdown" = "allow"
"unused_self" = "allow"
"enum_glob_use" = "allow"
"unnested_or_patterns" = "allow"
"implicit_hasher" = "allow"
"doc_link_with_quotes" = "allow"
"format_push_string" = "allow"
"flat_map_option" = "allow"
"from_iter_instead_of_collect" = "allow"
"large_types_passed_by_value" = "allow"

["lints"."clippy"."all"]
"level" = "warn"
"priority" = -1

["lints"."clippy"."cargo"]
"level" = "warn"
"priority" = -1

["lints"."clippy"."pedantic"]
"level" = "warn"
"priority" = -1
