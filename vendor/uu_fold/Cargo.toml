# Vendored from uu_fold 0.12.0; see .cargo_vcs_info.json for upstream provenance.
[package]
name = "uu_fold"
version = "0.12.0"
edition = "2024"
rust-version = "1.88.0"
description = "fold ~ (uutils) wrap input lines to fit in specified width"
homepage = "https://github.com/uutils/coreutils"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/fold"
license = "MIT"

[lib]
path = "src/fold.rs"
doctest = false

[[bin]]
name = "fold"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
fluent = "0.17.0"
unicode-width = "0.2.0"
uucore = "0.12.0"
