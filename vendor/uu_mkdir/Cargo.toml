# Vendored from uutils coreutils 0.12.0; upstream provenance is in .cargo_vcs_info.json.
[package]
edition = "2024"
rust-version = "1.88.0"
name = "uu_mkdir"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "mkdir ~ (uutils) create DIRECTORY"
homepage = "https://github.com/uutils/coreutils"
readme = "README.package.md"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/mkdir"

[features]
diagnostics = ["uucore/diagnostics"]
selinux = ["uucore/selinux"]
smack = ["uucore/smack"]

[lib]
name = "uu_mkdir"
path = "src/mkdir.rs"
test = false
doctest = false

[[bin]]
name = "mkdir"
path = "src/main.rs"

[dependencies.clap]
version = "4.5"
features = [
    "wrap_help",
    "cargo",
    "color",
]

[dependencies.fluent]
version = "0.17.0"

[dependencies.uucore]
version = "0.12.0"
features = [
    "fs",
    "libc",
    "fsxattr",
    "mode",
]

[target."cfg(unix)".dependencies.rustix]
version = "1.1.4"
features = [
    "process",
    "fs",
]
default-features = false

