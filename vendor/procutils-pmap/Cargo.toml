# Vendored from procutils-pmap 0.2.0; see .cargo_vcs_info.json for upstream provenance.
# AXE changes: hexadecimal devices and procps headings/column formatting.
[package]
name = "procutils-pmap"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Patrick Elsen <pelsen@xfbs.net>"]
description = "Report memory map of a process"
homepage = "https://rustutils.gitlab.io/procutils"
repository = "https://gitlab.com/rustutils/procutils"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
procfs = "0.18"
procutils-common = "0.2.0"

[[bin]]
name = "pmap"
path = "src/main.rs"
