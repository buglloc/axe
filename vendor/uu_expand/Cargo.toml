# Vendored from uu_expand 0.12.0; see .cargo_vcs_info.json for upstream provenance.
[package]
name = "uu_expand"
version = "0.12.0"
edition = "2024"
rust-version = "1.88.0"
description = "expand ~ (uutils) convert tabs to spaces"
homepage = "https://github.com/uutils/coreutils"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/expand"
license = "MIT"

[lib]
path = "src/expand.rs"
doctest = false

[[bin]]
name = "expand"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
fluent = "0.17.0"
thiserror = "2.0.3"
uucore = "0.12.0"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }
