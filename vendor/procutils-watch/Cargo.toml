# Vendored from procutils-watch 0.2.0; see .cargo_vcs_info.json for upstream provenance.
# AXE changes: display-width clipping and terminal keyboard/cleanup lifecycle.
[package]
name = "procutils-watch"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Patrick Elsen <pelsen@xfbs.net>"]
description = "Execute a program periodically, showing output fullscreen"
homepage = "https://rustutils.gitlab.io/procutils"
repository = "https://gitlab.com/rustutils/procutils"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
crossterm = "0.29"
procutils-common = "0.2.0"
rustix = { version = "1", features = ["event", "process", "termios"] }
unicode-width = "0.2"
unicode-segmentation = "1"
signal-hook = { version = "0.3", default-features = false }

[[bin]]
name = "watch"
path = "src/main.rs"
