# Vendored from uutils coreutils 0.12.0; upstream provenance is in .cargo_vcs_info.json.
[package]
edition = "2024"
rust-version = "1.88.0"
name = "uu_mkfifo"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "mkfifo ~ (uutils) create FIFOs (named pipes)"
homepage = "https://github.com/uutils/coreutils"
readme = "README.package.md"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/mkfifo"

[features]
diagnostics = ["uucore/diagnostics"]
selinux = ["uucore/selinux"]
smack = ["uucore/smack"]

[lib]
name = "uu_mkfifo"
path = "src/mkfifo.rs"
test = false
doctest = false

[[bin]]
name = "mkfifo"
path = "src/main.rs"

[dependencies.clap]
version = "4.5"
features = [
    "wrap_help",
    "cargo",
    "color",
]

[dependencies.fluent]
version = "0.17.0"

[dependencies.uucore]
version = "0.12.0"
features = [
    "fs",
    "mode",
]

[target.'cfg(target_vendor = "apple")'.dependencies.libc]
version = "0.2.186"

[target."cfg(unix)".dependencies.rustix]
version = "1.1.4"
features = [
    "fs",
    "process",
]
default-features = false

