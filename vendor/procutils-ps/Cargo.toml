# Vendored from procutils-ps 0.2.0; see .cargo_vcs_info.json for upstream provenance.
# AXE changes: focused process-selection and formatting fixes, without snapshot dependencies.
[package]
name = "procutils-ps"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Patrick Elsen <pelsen@xfbs.net>"]
description = "Report a snapshot of the current processes"
homepage = "https://rustutils.gitlab.io/procutils"
repository = "https://gitlab.com/rustutils/procutils"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
cols = { version = "0.3.0", features = ["color", "regex", "derive"] }
procfs = "0.18"
procutils-common = "0.2.0"

[[bin]]
name = "ps"
path = "src/main.rs"
