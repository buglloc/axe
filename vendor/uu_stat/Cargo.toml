# Vendored from uutils coreutils 0.12.0; upstream provenance is in .cargo_vcs_info.json.
[package]
edition = "2024"
rust-version = "1.88.0"
name = "uu_stat"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "stat ~ (uutils) display FILE status"
homepage = "https://github.com/uutils/coreutils"
readme = "README.package.md"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/stat"

[features]
selinux = ["uucore/selinux"]

[lib]
name = "uu_stat"
path = "src/stat.rs"
doctest = false

[[bin]]
name = "stat"
path = "src/main.rs"

[dependencies.clap]
version = "4.5"
features = [
    "wrap_help",
    "cargo",
    "color",
]

[dependencies.fluent]
version = "0.17.0"

[dependencies.rustix]
version = "1.1.4"
features = ["fs"]
default-features = false

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
version = "0.12.0"
features = [
    "entries",
    "libc",
    "fs",
    "fsext",
    "time",
    "quoting-style",
    "i18n-common",
]

