# Source: uutils/util-linux 0cb1f90b9983c504a7f895ba65caa4b0b1f51c20.
# AXE patch: byte-preserving input paths. Format strings (-e/-f) are unsupported.
[package]
name = "uu_hexdump"
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/uutils/util-linux"
description = "hexdump ~ display file contents in hexadecimal, decimal, octal, or ascii"

[lib]
path = "src/hexdump.rs"
doctest = false

[dependencies]
uucore = { version = "=0.2.2", features = ["parser"] }
clap = { version = "4.4", features = ["wrap_help", "cargo"] }
