# Vendored from rust_tree 1.3.0; see .cargo_vcs_info.json for upstream provenance.
[package]
name = "rust_tree"
version = "1.3.0"
edition = "2021"
authors = ["Peter Etelej <peter@etelej.com>"]
autobins = false
autotests = false
autobenches = false
description = """
tree is a cross-platform tree application and library that produces
an indented directory listing of files.
"""
homepage = "https://github.com/peteretelej/tree"
repository = "https://github.com/peteretelej/tree"
license = "MIT"

[lib]
path = "src/lib.rs"
doctest = false
test = false

[dependencies]
ansi_term = "0.12.1"
clap = { version = "4.5.36", features = ["derive"] }
glob = "0.3.2"
is_executable = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
