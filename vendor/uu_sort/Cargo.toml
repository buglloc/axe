# Vendored from uutils coreutils 0.12.0; upstream provenance is in .cargo_vcs_info.json.
[package]
edition = "2024"
rust-version = "1.88.0"
name = "uu_sort"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "sort ~ (uutils) sort input lines"
homepage = "https://github.com/uutils/coreutils"
readme = "README.package.md"
keywords = [
    "coreutils",
    "uutils",
    "cross-platform",
    "cli",
    "utility",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/sort"

[features]
default = ["i18n-collator"]
diagnostics = ["uucore/diagnostics"]
i18n-collator = ["uucore/i18n-collator"]

[lib]
name = "uu_sort"
path = "src/sort.rs"
doctest = false

[[bin]]
name = "sort"
path = "src/main.rs"

[dependencies.bigdecimal]
version = "0.4"

[dependencies.clap]
version = "4.5"
features = [
    "wrap_help",
    "cargo",
    "color",
]

[dependencies.fluent]
version = "0.17.0"

[dependencies.foldhash]
version = "0.2.0"

[dependencies.itertools]
version = "0.15.0"

[dependencies.memchr]
version = "2.7.2"

[dependencies.rand]
version = "0.10.1"
features = ["std_rng"]

[dependencies.rayon]
version = "1.10"

[dependencies.self_cell]
version = "1.0.4"

[dependencies.tempfile]
version = "3.15.0"

[dependencies.thiserror]
version = "2.0.3"

[dependencies.uucore]
version = "0.12.0"
features = [
    "fs",
    "parser-size",
    "version-cmp",
    "i18n-decimal",
    "i18n-collator",
    "i18n-datetime",
]

[target.'cfg(all(unix, not(any(target_os = "redox", target_os = "fuchsia", target_os = "haiku", target_os = "solaris", target_os = "illumos"))))'.dependencies.rustix]
version = "1.1.4"
features = [
    "fs",
    "system",
    "process",
]
default-features = false

[target.'cfg(not(any(target_os = "redox", target_os = "wasi")))'.dependencies.ctrlc]
version = "3.5.2"
features = ["termination"]

[target."cfg(unix)".dependencies.libc]
version = "0.2.186"

