# Vendored from uu_fmt 0.12.0; see .cargo_vcs_info.json for upstream provenance.
[package]
name = "uu_fmt"
version = "0.12.0"
edition = "2024"
rust-version = "1.88.0"
description = "fmt ~ (uutils) reformat paragraphs"
homepage = "https://github.com/uutils/coreutils"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/fmt"
license = "MIT"

[lib]
path = "src/fmt.rs"
doctest = false

[[bin]]
name = "fmt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
fluent = "0.17.0"
thiserror = "2.0.3"
uucore = "0.12.0"
