[workspace]
resolver = "3"
members = [
    "crates/axe-paths",
    "crates/axe",
    "crates/axe-relay",
    "crates/axe-artifact",
    "crates/axe-store-client",
    "crates/axe-store",
    "crates/vzik",
]
# Vendored providers remain dependencies, not additional AXE workspace targets.
exclude = ["vendor"]

[workspace.metadata.brush-fork]
# Update all Brush crates together from this immutable upstream revision: the three
# patched crates are vendored under `paths`, the unmodified crates are pinned
# to the same revision through [patch.crates-io].
repository = "https://github.com/reubeno/brush"
revision = "e37b3c91b7f3d2cc5a67cdc38381f480044d7a7b"
brush-shell-version = "0.4.0"
brush-core-version = "0.5.0"
brush-builtins-version = "0.2.0"
brush-parser-version = "0.4.0"
brush-interactive-version = "0.4.0"
brush-coreutils-builtins-version = "0.1.0"
brush-clap-adapter-version = "0.1.0"
paths = ["vendor/brush-shell", "vendor/brush-core", "vendor/brush-builtins"]

[workspace.package]
version = "0.12.1"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
axe-artifact = { path = "crates/axe-artifact" }
axe-paths = { path = "crates/axe-paths" }
axe-relay = { path = "crates/axe-relay", default-features = false }
axe-store-client = { path = "crates/axe-store-client" }
vzik = { path = "crates/vzik" }
base64 = "0.22"
bytes = "1.11"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
clap_builder = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
chrono = "0.4"
ed25519-dalek = { version = "2.2", features = ["digest", "rand_core"] }
bzip2 = "0.6"
futures-util = "0.3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
goblin = "=0.10.4"
hex = { version = "0.4", features = ["serde"] }
jaq-all = { version = "0.4.0", default-features = false, features = ["std-all"] }
libc = "0.2"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.5"
rand = "0.10"
hickory-resolver = "0.26"
linux-raw-sys = { version = "0.12", features = ["ioctl", "loop_device"] }
inotify = { version = "0.11", default-features = false }
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "encoder", "xz"] }
netlink-packet-route = "0.33"
object = { version = "0.37", default-features = false, features = ["read", "elf"] }
regex = "1.11"
rtnetlink = "0.23"
prost = "0.14"
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
gix-imara-diff = "0.3.3"
signal-hook = "0.3"
toml = "0.9"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2.5"
which = { version = "8.0.6", default-features = false, features = ["real-sys"] }
webpki-root-certs = "1.0.10"
zip = { version = "8.0", default-features = false, features = ["deflate"] }
zstd = "0.13"

[patch.crates-io]
jaq-json = { path = "vendor/jaq-json" }
brush-shell = { path = "vendor/brush-shell" }
brush-core = { path = "vendor/brush-core" }
brush-builtins = { path = "vendor/brush-builtins" }
brush-parser = { git = "https://github.com/reubeno/brush", rev = "e37b3c91b7f3d2cc5a67cdc38381f480044d7a7b" }
brush-interactive = { git = "https://github.com/reubeno/brush", rev = "e37b3c91b7f3d2cc5a67cdc38381f480044d7a7b" }
brush-coreutils-builtins = { git = "https://github.com/reubeno/brush", rev = "e37b3c91b7f3d2cc5a67cdc38381f480044d7a7b" }
brush-clap-adapter = { git = "https://github.com/reubeno/brush", rev = "e37b3c91b7f3d2cc5a67cdc38381f480044d7a7b" }
awk-rs = { path = "vendor/awk-rs" }
diffutils = { path = "vendor/diffutils" }
findutils = { path = "vendor/findutils" }
rust_tree = { path = "vendor/rust_tree" }
sed-rs = { path = "vendor/sed-rs" }
procutils-free = { path = "vendor/procutils-free" }
procutils-pgrep = { path = "vendor/procutils-pgrep" }
procutils-pmap = { path = "vendor/procutils-pmap" }
procutils-skill = { path = "vendor/procutils-skill" }
procutils-top = { path = "vendor/procutils-top" }
procutils-vmstat = { path = "vendor/procutils-vmstat" }
procutils-w = { path = "vendor/procutils-w" }
procutils-watch = { path = "vendor/procutils-watch" }
procutils-ps = { path = "vendor/procutils-ps" }
uu_df = { path = "vendor/uu_df" }
uu_base32 = { path = "vendor/uu_base32" }
uu_csplit = { path = "vendor/uu_csplit" }
uu_env = { path = "vendor/uu_env" }
uu_expand = { path = "vendor/uu_expand" }
uu_fmt = { path = "vendor/uu_fmt" }
uu_fold = { path = "vendor/uu_fold" }
uu_grep = { path = "vendor/uu_grep" }
uu_install = { path = "vendor/uu_install" }
uu_logname = { path = "vendor/uu_logname" }
uu_ls = { path = "vendor/uu_ls" }
uu_mkdir = { path = "vendor/uu_mkdir" }
uu_mkfifo = { path = "vendor/uu_mkfifo" }
uu_mknod = { path = "vendor/uu_mknod" }
uu_more = { path = "vendor/uu_more" }
uu_pr = { path = "vendor/uu_pr" }
uu_printf = { path = "vendor/uu_printf" }
uu_printenv = { path = "vendor/uu_printenv" }
uu_ptx = { path = "vendor/uu_ptx" }
uu_shred = { path = "vendor/uu_shred" }
uu_sort = { path = "vendor/uu_sort" }
uu_stat = { path = "vendor/uu_stat" }
uu_stty = { path = "vendor/uu_stty" }
uu_unexpand = { path = "vendor/uu_unexpand" }
# uucore embeds utility locales from the complete upstream source tree.
uucore = { git = "https://github.com/uutils/coreutils", tag = "0.12.0" }

# brush-interactive depends on its upstream brush-core sibling by path; keep one patched copy.
[patch."https://github.com/reubeno/brush"]
brush-core = { path = "vendor/brush-core" }

[profile.release]
opt-level = "s"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
