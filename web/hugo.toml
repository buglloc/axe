baseURL = "/"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]
title = "AXE — Portable rescue shell"
copyright = "AXE is open source under the MIT License."

[languages.en]
  locale = "en-US"

[markup]
  [markup.highlight]
    noClasses = false

[params]
  subtitle = "A rescue shell in a single executable: interactive shell, Unix tools, host diagnostics, certificate-only SSH and a verified on-demand tool store."
  keywords = "rescue shell, static linux tools, ssh server, incident response, portable shell"
  contentTypeName = "pages"
  showMenuItems = 6
  fullWidthTheme = true
  centerTheme = false
  oneHeadingSize = false

  [params.logo]
    logoText = "AXE"
    logoHomeLink = "/"

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"

[[menus.main]]
  name = "Commands"
  url = "/tools/"
  weight = 20
[[menus.main]]
  name = "Patches"
  url = "/patches/"
  weight = 30
[[menus.main]]
  name = "Changelog"
  url = "/changelog/"
  weight = 40
[[menus.main]]
  name = "Source"
  url = "https://github.com/buglloc/axe"
  weight = 50
