[target.x86_64-unknown-linux-musl]
linker = "tools/rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static", "-C", "linker-flavor=ld.lld", "-C", "link-arg=-no-pie"]

[target.aarch64-unknown-linux-musl]
linker = "tools/rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static", "-C", "linker-flavor=ld.lld", "-C", "link-arg=-no-pie"]
