uu_dmesg = { git = "https://github.com/uutils/util-linux", rev = "77b6743fb63660a6a3f9a9ad09ff1963480d0e74" }
uu_hexdump = { git = "https://github.com/uutils/util-linux", rev = "77b6743fb63660a6a3f9a9ad09ff1963480d0e74" }
uu_last = { git = "https://github.com/uutils/util-linux", rev = "77b6743fb63660a6a3f9a9ad09ff1963480d0e74" }
uu_mountpoint = { git = "https://github.com/uutils/util-linux", rev = "77b6743fb63660a6a3f9a9ad09ff1963480d0e74" }

[dev-dependencies]
serde_json.workspace = true
testcontainers = "0.28"

[build-dependencies]
axe-artifact.workspace = true
ed25519-dalek.workspace = true
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ecdsa"] }
serde.workspace = true
serde_json.workspace = true
rustls-pemfile.workspace = true
zstd.workspace = true


