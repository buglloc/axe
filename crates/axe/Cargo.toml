[package]
name = "axe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AXE shell with statically bundled Unix applets"
license.workspace = true

[[bin]]
name = "axe"
path = "src/main.rs"

[dependencies]
axe-paths.workspace = true
axe-artifact.workspace = true
axe-relay.workspace = true
axe-store-client.workspace = true
awk-rs = { version = "=0.2.0" }
base64.workspace = true
bytes.workspace = true
brush-shell = { version = "=0.4.0", default-features = false, features = ["minimal", "reedline"] }
brush-coreutils-builtins = { version = "=0.1.0", features = ["coreutils.all"] }
bzip2.workspace = true
clap.workspace = true
diffutils = { version = "0.5.0" }
findutils = { version = "0.10.0" }
flate2.workspace = true
file-format = { version = "0.29.0", features = ["reader"] }
lzma-rust2.workspace = true
hickory-resolver.workspace = true
object.workspace = true
regex.workspace = true
goblin.workspace = true
jaq-all.workspace = true
memmap2 = "0.9"
sed-rs = { version = "2.0.0" }
similar.workspace = true
tar.workspace = true
serde_json.workspace = true
serde.workspace = true
uucore = { version = "=0.12.0" }
uu_chgrp = { version = "=0.12.0" }
uu_chmod = { version = "=0.12.0" }
uu_chown = { version = "=0.12.0" }
uu_groups = { version = "=0.12.0" }
uu_id = { version = "=0.12.0" }
uu_kill = { version = "=0.12.0" }
uu_logname = { version = "=0.12.0" }
uu_mkfifo = { version = "=0.12.0" }
uu_mknod = { version = "=0.12.0" }
uu_nohup = { version = "=0.12.0" }
uu_stat = { version = "=0.12.0" }
uu_pathchk = { version = "=0.12.0" }
uu_stty = { version = "=0.12.0" }
uu_timeout = { version = "=0.12.0" }
uu_test = { version = "=0.12.0" }
uu_tty = { version = "=0.12.0" }
uu_grep = { version = "0.2.0" }
russh = { version = "0.63.1", default-features = false, features = ["ring"] }
russh-sftp = { version = "=2.4.0" }
rustls.workspace = true
rustls-pemfile.workspace = true
rust_tree = { version = "=1.3.0" }
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
which.workspace = true
ureq.workspace = true
url.workspace = true
webpki-root-certs.workspace = true
vzik.workspace = true
whoami = { version = "2.1.3" }
zstd = { workspace = true, features = ["zstdmt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "term"] }
signal-hook.workspace = true
libc.workspace = true
uu_chroot = { version = "=0.12.0" }
uu_hostid = { version = "=0.12.0" }
uu_install = { version = "=0.12.0" }
uu_nice = { version = "=0.12.0" }
uu_pinky = { version = "=0.12.0" }
uu_uptime = { version = "=0.12.0" }
uu_users = { version = "=0.12.0" }
uu_who = { version = "=0.12.0" }

[target.'cfg(target_os = "linux")'.dependencies]
chrono.workspace = true
futures-util.workspace = true
inotify.workspace = true
linux-raw-sys.workspace = true
netlink-packet-route.workspace = true
rtnetlink.workspace = true
surge-ping.workspace = true
procps-uucore = { package = "uucore", version = "=0.7.0" }
